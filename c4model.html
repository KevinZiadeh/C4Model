<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Strata: C4 diagram studio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f4f9;
        --sf: #fff;
        --sf2: #eceef6;
        --tx: #161a23;
        --mu: #667086;
        --ln: #dde1ec;
        --ac: #5b6cff;
        --sh: 0 8px 28px rgba(20, 28, 60, 0.13);
        --dot: #c5cadb;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0f16;
          --sf: #161b26;
          --sf2: #1f2533;
          --tx: #e8ebf3;
          --mu: #8b94a8;
          --ln: #2a3142;
          --ac: #8793ff;
          --sh: 0 8px 28px rgba(0, 0, 0, 0.5);
          --dot: #2b3345;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0f16;
        --sf: #161b26;
        --sf2: #1f2533;
        --tx: #e8ebf3;
        --mu: #8b94a8;
        --ln: #2a3142;
        --ac: #8793ff;
        --sh: 0 8px 28px rgba(0, 0, 0, 0.5);
        --dot: #2b3345;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.4 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--sf);
        border-bottom: 1px solid var(--ln);
        z-index: 6;
      }
      .lg {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
        margin-right: 4px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        flex: 1;
        overflow-x: auto;
        min-width: 0;
      }
      .tab {
        border: 0;
        background: transparent;
        padding: 6px 12px;
        border-radius: 9px;
        color: var(--mu);
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.on {
        background: var(--sf2);
        color: var(--tx);
        font-weight: 600;
      }
      .tab b {
        margin-left: 8px;
        opacity: 0.5;
      }
      .tab b:hover {
        opacity: 1;
      }
      .ti {
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid var(--ac);
        background: var(--sf);
        width: 140px;
      }
      .ib {
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 9px;
        min-width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .ib:hover {
        background: var(--sf2);
      }
      #zp {
        width: 42px;
        text-align: center;
        color: var(--mu);
        font-size: 12px;
      }
      .ib#nw {
        padding: 0 9px;
        font-weight: 600;
      }
      #st {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #cv {
        position: absolute;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        background-image: radial-gradient(
          circle,
          var(--dot) 1.2px,
          transparent 1.4px
        );
      }
      #w {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #w.an {
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #es,
      #ts {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: visible;
        pointer-events: none;
      }
      #ts {
        display: none;
      }
      #nd {
        position: absolute;
        left: 0;
        top: 0;
      }
      .pn {
        position: absolute;
        top: 12px;
        z-index: 5;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 16px;
        box-shadow: var(--sh);
        padding: 14px;
        max-height: calc(100% - 24px);
        overflow: auto;
        box-sizing: border-box;
      }
      #lp {
        left: 12px;
        width: 232px;
      }
      #rp {
        right: 12px;
        width: 262px;
      }
      .pn.off {
        display: none;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--mu);
      }
      .mu {
        color: var(--mu);
        margin: 0;
      }
      #pal {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 16px;
      }
      .palh {
        grid-column: 1/-1;
        margin: 4px 0 0;
      }
      .chip,
      .mi {
        cursor: grab;
        border-radius: 9px;
      }
      .chip {
        padding: 7px 9px;
        border: 1px solid color-mix(in srgb, var(--c) 45%, var(--ln));
        background: color-mix(in srgb, var(--c) 12%, var(--sf));
        font-size: 12px;
        font-weight: 500;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .mi {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 28px 6px 8px;
      }
      .mi:hover,
      .mi.on {
        background: var(--sf2);
      }
      .mi.dragover {
        background: color-mix(in srgb, var(--ac) 14%, var(--sf2));
        outline: 1px dashed var(--ac);
        outline-offset: -1px;
      }
      .mi i {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--c);
        flex: none;
      }
      .mi span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mi em {
        font-style: normal;
        font-size: 10px;
        color: var(--mu);
        background: var(--sf2);
        padding: 1px 7px;
        border-radius: 99px;
      }
      .mi-x {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mu);
        cursor: pointer;
        opacity: 0;
        font-size: 15px;
        line-height: 20px;
        padding: 0;
      }
      .mi:hover .mi-x,
      .mi:focus-within .mi-x {
        opacity: 1;
      }
      .mi-x:hover {
        background: var(--sf);
        color: #e5484d;
      }
      #rp label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        color: var(--mu);
      }
      #rp input,
      #rp select,
      #rp textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--ln);
        border-radius: 9px;
        background: var(--sf);
        color: var(--tx);
        resize: vertical;
      }
      #rp input:focus,
      #rp select:focus,
      #rp textarea:focus {
        outline: 2px solid var(--ac);
        outline-offset: -1px;
      }
      .mono {
        font:
          11px "JetBrains Mono",
          monospace;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 12px;
      }
      .tags span {
        background: var(--sf2);
        border-radius: 99px;
        padding: 2px 9px;
        font-size: 11px;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .bt {
        flex: 1;
        padding: 7px;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 9px;
        cursor: pointer;
        font-size: 12px;
      }
      .bt:hover {
        background: var(--sf2);
      }
      .dg {
        color: #e5484d;
      }
      #hud {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        padding: 4px;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 14px;
        box-shadow: var(--sh);
        z-index: 5;
      }
      .lv {
        border: 0;
        background: transparent;
        padding: 7px 12px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--mu);
        font-weight: 500;
        white-space: nowrap;
      }
      .lv.on {
        background: var(--ac);
        color: #fff;
      }
      .grp {
        position: absolute;
        box-sizing: border-box;
        border: 1.5px dashed var(--mu);
        border-radius: 14px;
        background: color-mix(in srgb, var(--sf2) 34%, transparent);
        pointer-events: none;
        z-index: 0;
      }
      .grp .gn {
        position: absolute;
        left: 12px;
        top: -11px;
        padding: 2px 8px;
        border: 1px dashed var(--mu);
        border-radius: 7px;
        background: var(--sf);
        color: var(--mu);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .grp.off {
        display: none;
      }
      .n {
        position: absolute;
        box-sizing: border-box;
        user-select: none;
        cursor: pointer;
        pointer-events: none;
      }
      .sh {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
        filter: drop-shadow(0 2px 5px rgba(20, 28, 60, 0.12));
      }
      .x .sh {
        filter: none;
      }
      .sp {
        fill: color-mix(in srgb, var(--c) 13%, var(--sf));
        stroke: color-mix(in srgb, var(--c) 55%, var(--ln));
        stroke-width: 1.6;
        pointer-events: all;
      }
      .x .sp {
        fill: color-mix(in srgb, var(--c) 6%, transparent);
      }
      .external .sp {
        stroke-dasharray: 6 4;
      }
      .sd {
        fill: none;
        stroke: color-mix(in srgb, var(--c) 60%, var(--ln));
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sf {
        fill: color-mix(in srgb, var(--c) 60%, var(--ln));
        stroke: none;
      }
      .sb {
        fill: color-mix(in srgb, var(--c) 24%, var(--sf));
        stroke: none;
      }
      .n.sel .sp {
        stroke: var(--ac);
        stroke-width: 2.6;
      }
      .in {
        position: relative;
        overflow: hidden;
        height: 100%;
        box-sizing: border-box;
      }
      .x .in {
        height: auto;
      }
      .n .in > *,
      .n .h {
        pointer-events: auto;
      }
      .n.cc .in {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .n.ct .in {
        text-align: center;
      }
      .cc .nm,
      .cc .tp,
      .ct .nm,
      .ct .tp {
        padding-right: 0;
      }
      .cc .desc {
        display: none;
      }
      .tp {
        font-size: 10px;
        font-weight: 600;
        color: var(--c);
      }
      .nm {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.25;
      }
      .tech {
        color: var(--mu);
        font-size: 11px;
      }
      .desc {
        font-size: 11px;
        color: var(--mu);
        margin-top: 3px;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .x .desc {
        display: none;
      }
      .code {
        font:
          10px/1.4 "JetBrains Mono",
          monospace;
        background: var(--sf2);
        border-radius: 6px;
        padding: 5px 7px;
        margin-top: 6px;
        white-space: pre-wrap;
        color: var(--tx);
      }
      .h {
        position: absolute;
        right: 0;
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ac);
        border: 3px solid var(--sf);
        transform: translate(50%, -50%) scale(var(--iz, 1));
        cursor: crosshair;
        display: none;
      }
      .sel > .h {
        display: block;
      }
      .el {
        position: absolute;
        transform: translate(-50%, -50%);
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 99px;
        padding: 1px 9px;
        font-size: 11px;
        color: var(--mu);
        white-space: nowrap;
        cursor: pointer;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .el.sel {
        border-color: var(--ac);
        color: var(--ac);
      }
      .ep {
        fill: none;
        stroke: var(--mu);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .eh {
        fill: none;
        stroke: transparent;
        stroke-width: 14;
        vector-effect: non-scaling-stroke;
        pointer-events: stroke;
        cursor: pointer;
      }
      .ah {
        fill: var(--mu);
      }
      .ep.sel {
        stroke: var(--ac);
      }
      .ah.sel {
        fill: var(--ac);
      }
      #tl {
        stroke: var(--ac);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        vector-effect: non-scaling-stroke;
      }
      [data-b="0"] .tech,
      [data-b="0"] .desc,
      [data-b="0"] .tp,
      [data-b="0"] .el {
        display: none;
      }
      [data-b="1"] .desc {
        display: none;
      }
      @media (max-width: 700px) {
        .lb {
          display: none;
        }
      }

      .ic {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 22px;
        height: 22px;
        color: var(--c);
        pointer-events: none;
      }
      .ic svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nm,
      .tp {
        padding-right: 26px;
      }
      .tg {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        display: flex;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
        pointer-events: none;
      }
      .tg i {
        flex: 1;
      }
      .tags span.tc {
        background: color-mix(in srgb, var(--c) 18%, var(--sf));
        box-shadow: inset 3px 0 0 var(--c);
        padding-left: 11px;
      }

      .n.dm {
        opacity: 0.28;
      }
      .n.hl {
        z-index: 3;
      }
      .n.hl .sp {
        stroke: var(--tc);
        stroke-width: 3;
      }
      .n.hl .sh {
        filter: drop-shadow(0 0 8px var(--tc));
      }
      .ep.dm,
      .ah.dm {
        opacity: 0.18;
      }
      .el.dm {
        opacity: 0.25;
      }
      #lgd {
        position: absolute;
        left: 50%;
        bottom: 66px;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
        max-width: min(760px, calc(100% - 24px));
        padding: 6px 8px;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 14px;
        box-shadow: var(--sh);
      }
      #lgd.off {
        display: none;
      }
      .lgt {
        font-size: 11px;
        color: var(--mu);
        padding: 0 4px;
      }
      .lt {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 99px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .lt i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--c);
      }
      .lt em {
        font-style: normal;
        font-size: 10px;
        color: var(--mu);
      }
      .lt:hover {
        background: var(--sf2);
      }
      .lt.on {
        border-color: var(--c);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent);
      }
      .md {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(10, 14, 24, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .md[hidden] {
        display: none;
      }
      .mb {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 16px;
        box-shadow: var(--sh);
        padding: 16px;
        width: min(880px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
      }
      .mb h3 {
        margin: 0;
        font-size: 15px;
        color: var(--tx);
      }
      #ct {
        height: 55vh;
        min-height: 260px;
        width: 100%;
        box-sizing: border-box;
        font:
          12px/1.5 "JetBrains Mono",
          monospace;
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 10px;
        resize: none;
        white-space: pre;
        tab-size: 4;
      }
      #cm {
        min-height: 18px;
        font-size: 12px;
      }
      .px {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 22px;
        height: 22px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--mu);
        cursor: pointer;
        font-size: 15px;
        line-height: 20px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .px:hover {
        background: var(--sf2);
        color: var(--tx);
        border-color: var(--ln);
      }
      #rp h3 {
        padding-right: 28px;
      }
      .bd{position:absolute;inset:0;background:rgba(8,12,26,.42);animation:bdi .2s ease-out}
      .dlg{position:absolute;left:28px;right:28px;top:0;bottom:28px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--ln);border-top:0;border-radius:0 0 16px 16px;box-shadow:0 18px 60px rgba(0,0,0,.35);animation:dli .26s cubic-bezier(.2,.8,.2,1)}
      @keyframes bdi{from{opacity:0}}
      @keyframes dli{from{opacity:0;transform:translateY(26px)}}
      .dh{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;flex:none;background:var(--sf);border-bottom:1px solid var(--ln)}
      .bc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
      .bc a{cursor:pointer}.bc a:hover{color:var(--tx)}.bc i{margin:0 7px;opacity:.5;font-style:normal}.bc b{color:var(--tx)}
      .cx{border:0;background:transparent;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:var(--mu)}
      .cx:hover{background:var(--sf2);color:var(--tx)}
      .lc{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px)}
      .lw{position:absolute;left:0;top:0;transform-origin:0 0}
      .lw.an{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
      .les,.lts{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
      .lts{display:none}
      .lnd{position:absolute;left:0;top:0}
      .ltl{stroke:var(--ac);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
      .n.stub .tp,.n.stub .tech,.n.stub .desc,.n.stub .ic,.n.stub .h,.n.stub .code{display:none}
      .n.stub .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #st.lo #hud{display:none}
      .wh,.wh circle{pointer-events:all}
      .wh circle{fill:var(--sf);stroke:var(--ac);stroke-width:2;vector-effect:non-scaling-stroke}
      .wh:hover circle{fill:var(--ac)}
      .wh.h{cursor:ns-resize}.wh.v{cursor:ew-resize}.wh.d{cursor:move}
      @media (max-width:700px){.dlg{left:14px;right:14px;bottom:14px}}
      @media (prefers-reduced-motion:reduce){.bd,.dlg{animation:none}}
    </style>
  </head>
  <body>
    <header>
      <div class="lg">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="var(--ac)" />
          <rect
            x="7"
            y="7"
            width="10"
            height="10"
            rx="3"
            fill="none"
            stroke="#fff"
            stroke-width="2"
          />
          <rect

            const m = (v.pos[L] = v.pos[L] || {});
            S.els
              .filter((c) => c.parent === pid && R[c.id])
              .forEach((c) => {
                if (!m[c.id])
                  m[c.id] = { x: R[c.id].x - pr.x, y: R[c.id].y - pr.y };
              });
            drag.fz = 1;
            drag.L = L;
            drag.ox = m[drag.id].x;
            drag.oy = m[drag.id].y;
          }
          const p = v.pos[drag.L][drag.id];
          p.x = Math.max(P, drag.ox + (e.clientX - drag.sx) / T.z);
          p.y = Math.max(HD, drag.oy + (e.clientY - drag.sy) / T.z);
          render();
        } else if (drag.k === "leg") {
          const q = w2(e),
            g = drag.g;
          let W;
          if (!g.routed)
            W = g.hz
              ? [{ x: q.x, y: g.s0.y }, { x: q.x, y: g.t0.y }]
              : [{ x: g.s0.x, y: q.y }, { x: g.t0.x, y: q.y }];
          else {
            const ax = drag.hor ? "y" : "x",
              span = (Rc) => (drag.hor ? [Rc.y + 10, Rc.y + Rc.h - 10] : [Rc.x + 10, Rc.x + Rc.w - 10]);
            let t = drag.hor ? q.y - drag.p.y : q.x - drag.p.x,
              lo = -1e9,
              hi = 1e9;
            [[0, R[g.a]], [g.pts.length - 2, R[g.b]]].forEach(([n, Rc]) => {
              if (drag.i !== n) return;
              const sp = span(Rc);
              lo = Math.max(lo, sp[0] - drag.base);
              hi = Math.min(hi, sp[1] - drag.base);
            });
            t = Math.max(lo, Math.min(hi, t));
            W = drag.W0.map((p, j) => (j === drag.i - 1 || j === drag.i ? { ...p, [ax]: p[ax] + t } : p));
          }
          ewset(drag.key, W);
          render();
        } else if (drag.k === "stub") {
          const o = lay(1).x;
          o[drag.id] = { x: drag.ox + (e.clientX - drag.sx) / T.z, y: drag.oy + (e.clientY - drag.sy) / T.z };
          render();
        } else if (drag.k === "move") {
          const v = V(),
            k = lvl(),
            p = k > 1 ? (((v.tp = v.tp || {})[k] = v.tp[k] || {})[drag.top] = {}) : v.nodes[drag.top];
          p.x = drag.ox + (e.clientX - drag.sx) / T.z;
          p.y = drag.oy + (e.clientY - drag.sy) / T.z;
          render();
        } else {
          const q = w2(e),
            l = TL;
          l.setAttribute("x2", q.x);
          l.setAttribute("y2", q.y);
        }
      });
      addEventListener("pointerup", (e) => {
        if (!drag) return;
        if (drag.k === "leg") {
          ewFix(drag.key);
          render();
        }
        if (drag.k === "link") {
          TS.style.display = "none";
          const n = document.elementFromPoint(e.clientX, e.clientY),
            t = n && n.closest("[data-id]");
          if (t && t.dataset.id !== drag.from) {

              id: uid(),

            };

          }
        }
        drag = null;
        save();
      });
      cv.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const b = cv.getBoundingClientRect(),
            mx = e.clientX - b.left,
            my = e.clientY - b.top,
            z = Math.min(
              5,
              Math.max(
                0.2,
                T.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)),
              ),
            );
          T.x = mx - ((mx - T.x) * z) / T.z;
          T.y = my - ((my - T.y) * z) / T.z;
          const f = z / T.z;
          T.z = z;
          autoChk(mx, my, f);
          applyT();
        },
        { passive: false },
      );
      function selectLevel(l) {

      $("#zi").onclick = () => go(T.z * 1.35, selC());

      $("#nw").onclick = () => {
        if (

          return;
        S = {
          cur: "v1",

        hl = null;

      };
      try {

      } catch (e) {}
      function toDSL() {
        const q = (s) =>
            '"' +
            String(s == null ? "" : s)
              .replace(/\\/g, "\\\\")
              .replace(/"/g, '\\"')
              .replace(/\n/g, "\\n") +
            '"',
          KW = {
            person: "person",
            system: "softwareSystem",
            external: "softwareSystem",
            container: "container",
            component: "component",
          },
          o = ['workspace "Strata" {', "    model {"];
        const el = (e, ind) => {
          const a = [q(e.name), q(e.desc)],
            cn = e.type === "container" || e.type === "component",
            kids = S.els.filter((c) => c.parent === e.id),
            pr = [];
          if (cn) a.push(q(e.tech));
          else if (e.tech) pr.push(["technology", e.tech]);
          if (e.type === "external") pr.push(["kind", "external"]);
          if (e.icon) pr.push(["icon", e.icon]);
          if (e.shape) pr.push(["shape", e.shape]);
          if (e.code) pr.push(["code", e.code]);
          const tg = (e.tags || []).length,
            body = tg || pr.length || kids.length;
          o.push(
            `${ind}${e.id} = ${KW[e.type]} ${a.join(" ")}${body ? " {" : ""}`,
          );
          if (body) {
            if (tg) o.push(`${ind}    tags ${e.tags.map(q).join(" ")}`);
            if (pr.length) {
              o.push(`${ind}    properties {`);
              pr.forEach(([k, v]) => o.push(`${ind}        ${q(k)} ${q(v)}`));
              o.push(`${ind}    }`);
            }
            kids.forEach((c) => el(c, ind + "    "));
            o.push(ind + "}");
          }
        };
        S.els
          .filter((e) => !e.parent || !El(e.parent))
          .forEach((e) => el(e, "        "));
        o.push("");
        S.rels
          .filter((r) => El(r.from) && El(r.to))
          .forEach((r) =>
            o.push(
              `        ${r.from} -> ${r.to} ${q(r.label)}${r.tech ? " " + q(r.tech) : ""}`,
            ),
          );
        o.push("    }", "    views {");
        S.views.forEach((v) => {
          o.push(`        custom ${q(v.id)} ${q(v.name)} {`);
          S.els
            .filter((e) => v.nodes[e.id])
            .forEach((e) => o.push(`            include ${e.id}`));
          (v.groups || []).forEach((g) => {
            const ids = g.members.filter((id) => v.nodes[id] && El(id));
            if (ids.length)
              o.push(
                `            group ${q(g.id)} ${q(g.name)} {`,
                ...ids.map((id) => `                include ${id}`),
                "            }",
              );
          });
          const pr = [];
          Object.entries(v.nodes).forEach(([id, p]) => {
            if (El(id) && p.x != null)
              pr.push(["at." + id, Math.round(p.x) + "," + Math.round(p.y)]);
          });
          Object.entries(v.pos || {}).forEach(([L, m]) =>
            Object.entries(m).forEach(([id, p]) => {
              if (El(id))
                pr.push([
                  "pos." + L + "." + id,
                  Math.round(p.x) + "," + Math.round(p.y),
                ]);
            }),
          );
          pr.sort((a, b) => (a[0] < b[0] ? -1 : 1));
          if (pr.length) {
            o.push("            properties {");
            pr.forEach(([k, x]) => o.push(`                ${q(k)} ${q(x)}`));
            o.push("            }");
          }
          o.push("        }");
        });
        o.push("    }", "}", "");
        return o.join("\n");
      }
      function parseDSL(src) {
        const TY2 = {
            person: "person",
            softwareSystem: "system",
            container: "container",
            component: "component",
          },
          els = [],
          rels = [],
          views = [],
          byId = {};
        const tok = (l) => {
          const t = [],
            re = /"((?:[^"\\]|\\.)*)"|->|=|\{|\}|[^\s"={}]+/g;
          let m;
          while ((m = re.exec(l))) {
            t.push(
              m[0][0] === '"'
                ? {
                    s: m[1].replace(/\\(.)/g, (a, c) => (c === "n" ? "\n" : c)),
                  }
                : m[0],
            );
          }
          return t;
        };
        const ss = (a) =>
            a.filter((x) => typeof x === "object").map((x) => x.s),
          tg = (s) =>
            (s || "")
              .split(",")
              .map((x) => x.trim())
              .filter(Boolean),
          st = [{ k: "top" }];
        src.split(/\r?\n/).forEach((raw, i) => {
          const ln = raw.trim();
          if (!ln || ln[0] === "#" || ln.startsWith("//")) return;
          const t = tok(ln),
            bad = (m) => {
              throw new Error("Line " + (i + 1) + ": " + m);
            },
            c = st[st.length - 1];
          if (t[0] === "}") {
            if (st.length < 2) bad("unexpected }");
            st.pop();
            return;
          }
          const op = t[t.length - 1] === "{",
            b = op ? t.slice(0, -1) : t,
            w = b[0];
          if (c.k === "props") {
            const v = ss(b);
            if (v.length !== 2) bad('expected "key" "value"');
            c.ref.props[v[0]] = v[1];
            return;
          }
          if (c.k === "top") {
            if (w === "workspace" && op) {
              st.push({ k: "ws" });
              return;
            }
            bad("expected workspace {");
          }
          if (c.k === "ws") {
            if ((w === "model" || w === "views") && op) {
              st.push({ k: w });
              return;
            }
            bad("expected model { or views {");
          }
          if (c.k === "views") {
            if (w === "custom" && op) {
              const v = ss(b),
                vw = {
                  id: v.length > 1 ? v[0] : "v" + (views.length + 1),
                  name: v.length > 1 ? v[1] : v[0] || "Diagram",
                  inc: [],
                  props: {},
                  groups: [],
                };
              views.push(vw);
              st.push({ k: "view", ref: vw });
              return;
            }
            bad('expected custom "id" "title" {');
          }
          if (c.k === "view") {
            if (w === "include") {
              b.slice(1).forEach((x) => {
                if (typeof x === "string" && x !== "*") c.ref.inc.push(x);
              });
              return;
            }
            if (w === "group" && op) {
              const v = ss(b),
                gp = {
                  id: v.length > 1 ? v[0] : "g" + uid(),
                  name: v.length > 1 ? v[1] : v[0] || "Group",
                  members: [],
                };
              c.ref.groups.push(gp);
              st.push({ k: "group", ref: gp });
              return;
            }
            if (w === "properties" && op) {
              st.push({ k: "props", ref: c.ref });
              return;
            }
            bad("unexpected " + w);
          }
          if (c.k === "group") {
            if (w === "include") {
              b.slice(1).forEach((x) => {
                if (typeof x === "string" && x !== "*") c.ref.members.push(x);
              });
              return;
            }
            bad("unexpected " + w);
          }
          if (b[1] === "=" && TY2[b[2]]) {
            const v = ss(b.slice(3)),
              ty = TY2[b[2]],
              cn = ty === "container" || ty === "component",
              e = {
                id: b[0],
                type: ty,
                name: v[0] || b[0],
                desc: v[1] || "",
                tech: cn ? v[2] || "" : "",
                parent: c.k === "el" ? c.ref.id : null,
                tags: tg(cn ? v[3] : v[2]),
                props: {},
              };
            if (byId[e.id]) bad("duplicate id " + e.id);
            byId[e.id] = e;
            els.push(e);
            if (op) st.push({ k: "el", ref: e });
            return;
          }
          if (b[1] === "->") {
            const v = ss(b.slice(3));
            rels.push({
              f: b[0],
              t: b[2],
              l: v[0] || "",
              tech: v[1] || "",
              n: i + 1,
            });
            return;
          }
          if (c.k === "el" && w === "tags") {
            ss(b).forEach((x) =>
              tg(x).forEach((y) => {
                if (!c.ref.tags.includes(y)) c.ref.tags.push(y);
              }),
            );
            return;
          }
          if (c.k === "el" && w === "properties" && op) {
            st.push({ k: "props", ref: c.ref });
            return;
          }
          bad('unexpected "' + (typeof w === "object" ? w.s : w) + '"');
        });
        if (st.length > 1) throw new Error("Missing closing }");
        if (!els.length) throw new Error("No elements found");
        const E = els.map((e) => {
          const p = e.props;
          return {
            id: e.id,
            type:
              e.type === "system" && p.kind === "external"
                ? "external"
                : e.type,
            name: e.name,
            tech: e.tech || p.technology || "",
            desc: e.desc,
            parent: e.parent,
            code: p.code || "",
            tags: e.tags,
            icon: p.icon || "",
            shape: SHP[p.shape] ? p.shape : "",
          };
        });
        const RL = rels.map((r) => {
          if (!byId[r.f] || !byId[r.t])
            throw new Error(
              "Line " + r.n + ": unknown element in relationship",
            );
          return { id: uid(), from: r.f, to: r.t, label: r.l, tech: r.tech };
        });
        if (!views.length)
          views.push({
            id: "v1",
            name: "All elements",
            inc: els.filter((e) => !e.parent).map((e) => e.id),
            props: {},
          });
        const VS = views.map((v) => {
          const nodes = {},
            pos = {};
          v.inc.forEach((id, j) => {
            if (!byId[id])
              throw new Error('View "' + v.name + '": unknown element ' + id);
            const a = v.props["at." + id],
              xy = a ? a.split(",").map(Number) : null;
            nodes[id] =
              xy && xy.length === 2 && xy.every(isFinite)
                ? { x: xy[0], y: xy[1] }
                : { x: (j % 4) * 300, y: 80 + ((j / 4) | 0) * 200 };
          });
          Object.entries(v.props).forEach(([k, val]) => {
            const m = /^pos\.(\d)\.(.+)$/.exec(k),
              xy = val.split(",").map(Number);
            if (m && xy.length === 2 && xy.every(isFinite))
              (pos[m[1]] = pos[m[1]] || {})[m[2]] = { x: xy[0], y: xy[1] };
          });
          return {
            id: v.id,
            name: v.name,
            nodes,
            pos,
            groups: (v.groups || [])
              .map((g) => ({
                id: g.id,
                name: g.name,
                members: g.members.filter((id) => byId[id]),
              }))
              .filter((g) => g.members.length),
          };
        });
        return { cur: VS[0].id, els: E, rels: RL, views: VS };
      }
      const msg = (t, bad) => {
        const m = $("#cm");

        m.style.color = bad ? "#e5484d" : "";

      $("#cb").onclick = () => {

      $("#cap").onclick = () => {

      $("#tgb").onclick = () => $("#lgd").classList.toggle("off");
      $("#lgd").addEventListener("click", (e) => {
        const b = e.target.closest("[data-tag]");

      addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!$("#cd").hidden) $("#cd").hidden = true;
          else if (hl) {
            hl = null;
            render();
          }
        }
      });
      function boot() {
        closeTo(0);
        tabs();
        model();
        inspector();
        fit();
        render();
      }
      if (innerWidth < 820) {
        $("#lp").classList.add("off");
        $("#rp").classList.add("off");
      }

      const DSL_FILES = [
        "default.dsl",
        "diagram.dsl",
        "model.dsl",
        "workspace.dsl",
      ];
      async function seedFromFile() {
        for (const f of DSL_FILES) {
          let txt;
          try {
            const r = await fetch(f, { cache: "no-store" });
            if (!r.ok) continue;
            txt = await r.text();
          } catch (e) {
            continue;
          }
          /* SPA servers answer a missing file with index.html and a 200 */
          if (/^\s*<(!doctype|html)/i.test(txt)) continue;
          try {
            S = parseDSL(txt);
            return null;
          } catch (e) {
            return { f, txt, err: e.message };
          }
        }
        return null;
      }
      (restored ? Promise.resolve(null) : seedFromFile()).then((bad) => {
        boot();
        if (bad) {
          $("#ct").value = bad.txt;
          $("#cd").hidden = false;
          msg(bad.f + ": " + bad.err, 1);
        }
      });
    </script>
