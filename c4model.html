<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>C4Model: C4 diagram studio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f4f9;
        --sf: #fff;
        --sf2: #eceef6;
        --tx: #161a23;
        --mu: #667086;
        --ln: #dde1ec;
        --ac: #5b6cff;
        --sh: 0 8px 28px rgba(20, 28, 60, 0.13);
        --dot: #c5cadb;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0f16;
          --sf: #161b26;
          --sf2: #1f2533;
          --tx: #e8ebf3;
          --mu: #8b94a8;
          --ln: #2a3142;
          --ac: #8793ff;
          --sh: 0 8px 28px rgba(0, 0, 0, 0.5);
          --dot: #2b3345;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0f16;
        --sf: #161b26;
        --sf2: #1f2533;
        --tx: #e8ebf3;
        --mu: #8b94a8;
        --ln: #2a3142;
        --ac: #8793ff;
        --sh: 0 8px 28px rgba(0, 0, 0, 0.5);
        --dot: #2b3345;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.4 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--sf);
        border-bottom: 1px solid var(--ln);
        z-index: 6;
        overflow-x: auto;
        flex: none;
      }
      .lg {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
        margin-right: 4px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        flex: 1;
        overflow-x: auto;
        min-width: 0;
      }
      .tab {
        border: 0;
        background: transparent;
        padding: 6px 12px;
        border-radius: 9px;
        color: var(--mu);
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.on {
        background: var(--sf2);
        color: var(--tx);
        font-weight: 600;
      }
      .tab b {
        margin-left: 8px;
        opacity: 0.5;
      }
      .tab b:hover {
        opacity: 1;
      }
      .ti {
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid var(--ac);
        background: var(--sf);
        width: 140px;
      }
      .ib {
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 9px;
        min-width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .ib:hover {
        background: var(--sf2);
      }
      .ib.on {
        border-color: var(--ac);
        color: var(--ac);
        background: color-mix(in srgb, var(--ac) 10%, var(--sf));
      }
      #zp {
        width: 42px;
        text-align: center;
        color: var(--mu);
        font-size: 12px;
      }
      .ib#nw {
        padding: 0 9px;
        font-weight: 600;
      }
      #st {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #cv {
        position: absolute;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        background-image: radial-gradient(
          circle,
          var(--dot) 1.2px,
          transparent 1.4px
        );
      }
      #w {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #w.an {
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #es,
      #sg,
      #ts {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: visible;
        pointer-events: none;
      }
      #ts {
        display: none;
      }
      .snap-guide {
        stroke: var(--ac);
        stroke-width: 1;
        stroke-dasharray: 4 3;
        vector-effect: non-scaling-stroke;
      }
      #nd {
        position: absolute;
        left: 0;
        top: 0;
      }
      .pn {
        position: absolute;
        top: 12px;
        z-index: 5;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 16px;
        box-shadow: var(--sh);
        padding: 14px;
        max-height: calc(100% - 24px);
        overflow: auto;
        box-sizing: border-box;
      }
      #lp {
        left: 12px;
        width: 232px;
      }
      #rp {
        right: 12px;
        width: 262px;
      }
      .pn.off {
        display: none;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--mu);
      }
      .mu {
        color: var(--mu);
        margin: 0;
      }
      #pal {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 16px;
      }
      .palh {
        grid-column: 1/-1;
        margin: 4px 0 0;
      }
      .chip,
      .mi {
        cursor: grab;
        border-radius: 9px;
      }
      .chip {
        padding: 7px 9px;
        border: 1px solid color-mix(in srgb, var(--c) 45%, var(--ln));
        background: color-mix(in srgb, var(--c) 12%, var(--sf));
        font-size: 12px;
        font-weight: 500;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .mi {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 28px 6px 8px;
      }
      .mi:hover,
      .mi.on {
        background: var(--sf2);
      }
      .mi.dragover {
        background: color-mix(in srgb, var(--ac) 14%, var(--sf2));
        outline: 1px dashed var(--ac);
        outline-offset: -1px;
      }
      .mi i {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--c);
        flex: none;
      }
      .mi span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mi em {
        font-style: normal;
        font-size: 10px;
        color: var(--mu);
        background: var(--sf2);
        padding: 1px 7px;
        border-radius: 99px;
      }
      .mi-x {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mu);
        cursor: pointer;
        opacity: 0;
        font-size: 15px;
        line-height: 20px;
        padding: 0;
      }
      .mi:hover .mi-x,
      .mi:focus-within .mi-x {
        opacity: 1;
      }
      .mi-x:hover {
        background: var(--sf);
        color: #e5484d;
      }
      #rp label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        color: var(--mu);
      }
      #rp input,
      #rp select,
      #rp textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--ln);
        border-radius: 9px;
        background: var(--sf);
        color: var(--tx);
        resize: vertical;
      }
      #rp input:focus,
      #rp select:focus,
      #rp textarea:focus {
        outline: 2px solid var(--ac);
        outline-offset: -1px;
      }
      .mono {
        font:
          11px "JetBrains Mono",
          monospace;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 12px;
      }
      .tags span {
        background: var(--sf2);
        border-radius: 99px;
        padding: 2px 9px;
        font-size: 11px;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .bt {
        flex: 1;
        padding: 7px;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 9px;
        cursor: pointer;
        font-size: 12px;
      }
      .bt:hover {
        background: var(--sf2);
      }
      .dg {
        color: #e5484d;
      }
      #hud {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        padding: 4px;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 14px;
        box-shadow: var(--sh);
        z-index: 5;
        max-width: calc(100% - 20px);
        box-sizing: border-box;
        overflow-x: auto;
      }
      .lv {
        border: 0;
        background: transparent;
        padding: 7px 12px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--mu);
        font-weight: 500;
        white-space: nowrap;
      }
      .lv.on {
        background: var(--ac);
        color: #fff;
      }
      .grp {
        position: absolute;
        box-sizing: border-box;
        border: 1.5px dashed var(--mu);
        border-radius: 14px;
        background: color-mix(in srgb, var(--sf2) 34%, transparent);
        pointer-events: none;
        z-index: 0;
      }
      .grp .gn {
        position: absolute;
        left: 12px;
        top: -11px;
        padding: 2px 8px;
        border: 1px dashed var(--mu);
        border-radius: 7px;
        background: var(--sf);
        color: var(--mu);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .grp.off {
        display: none;
      }
      .n {
        position: absolute;
        box-sizing: border-box;
        user-select: none;
        cursor: pointer;
        pointer-events: none;
      }
      .sh {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
        filter: drop-shadow(0 2px 5px rgba(20, 28, 60, 0.12));
      }
      .x .sh {
        filter: none;
      }
      .sp {
        fill: color-mix(in srgb, var(--c) 13%, var(--sf));
        stroke: color-mix(in srgb, var(--c) 55%, var(--ln));
        stroke-width: 1.6;
        pointer-events: all;
      }
      .x .sp {
        fill: color-mix(in srgb, var(--c) 6%, transparent);
      }
      .external .sp {
        stroke-dasharray: 6 4;
      }
      .sd {
        fill: none;
        stroke: color-mix(in srgb, var(--c) 60%, var(--ln));
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sf {
        fill: color-mix(in srgb, var(--c) 60%, var(--ln));
        stroke: none;
      }
      .sb {
        fill: color-mix(in srgb, var(--c) 24%, var(--sf));
        stroke: none;
      }
      .n.sel .sp {
        stroke: var(--ac);
        stroke-width: 2.6;
      }
      .in {
        position: relative;
        overflow: hidden;
        height: 100%;
        box-sizing: border-box;
      }
      .x .in {
        height: auto;
      }
      .n .in > *,
      .n .h {
        pointer-events: auto;
      }
      .n.cc .in {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .n.ct .in {
        text-align: center;
      }
      .cc .nm,
      .cc .tp,
      .ct .nm,
      .ct .tp {
        padding-right: 0;
      }
      .tp {
        font-size: 10px;
        font-weight: 600;
        color: var(--c);
      }
      .nm {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.25;
      }
      .tech {
        color: var(--mu);
        font-size: 11px;
      }
      .desc {
        font-size: 11px;
        color: var(--mu);
        margin-top: 3px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .x .desc {
        display: none;
      }
      .code {
        font:
          10px/1.4 "JetBrains Mono",
          monospace;
        background: var(--sf2);
        border-radius: 6px;
        padding: 5px 7px;
        margin-top: 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--tx);
      }
      .n.conn .sp {
        stroke: var(--ac);
        stroke-width: 2.6;
      }
      .zoom {
        position: absolute;
        right: 8px;
        bottom: 10px;
        z-index: 2;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        padding: 3px;
        border: 1px solid var(--ln);
        border-radius: 7px;
        background: var(--sf);
        color: var(--c);
        cursor: zoom-in;
        pointer-events: auto;
      }
      .zoom svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .zoom:hover { border-color: var(--ac); color: var(--ac); }
      .h {
        position: absolute;
        right: 0;
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ac);
        border: 3px solid var(--sf);
        transform: translate(50%, -50%) scale(var(--iz, 1));
        cursor: crosshair;
        display: none;
      }
      .sel > .h {
        display: block;
      }
      .el {
        position: absolute;
        transform: translate(-50%, -50%);
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 99px;
        padding: 1px 9px;
        font-size: 11px;
        color: var(--mu);
        white-space: nowrap;
        cursor: pointer;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: none;
      }
      .el.sel {
        border-color: var(--ac);
        color: var(--ac);
      }
      .ep {
        fill: none;
        stroke: var(--mu);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .eh {
        fill: none;
        stroke: transparent;
        stroke-width: 14;
        vector-effect: non-scaling-stroke;
        pointer-events: stroke;
        cursor: pointer;
      }
      .ah {
        fill: var(--mu);
      }
      .ep.sel {
        stroke: var(--ac);
      }
      .ah.sel {
        fill: var(--ac);
      }
      .ep.conn { stroke: var(--ac); stroke-width: 2.3; }
      .ah.conn { fill: var(--ac); }
      .el.conn { border-color: var(--ac); color: var(--ac); }
      .ep.tag-flow { stroke: var(--flow-color); stroke-width: 2.3; }
      .ah.tag-flow { fill: var(--flow-color); }
      .flow, .flow * { pointer-events: none; }
      .flow-bubble { transform: scale(var(--iz, 1)); }
      .flow-halo { fill: var(--flow-color); opacity: .25; }
      .flow-core { fill: var(--flow-color); stroke: var(--sf); stroke-width: 1.5; }
      #tl {
        stroke: var(--ac);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        vector-effect: non-scaling-stroke;
      }
      [data-b="0"] .tech,
      [data-b="0"] .desc,
      [data-b="0"] .tp,
      [data-b="0"] .el {
        display: none;
      }
      [data-b="1"] .desc {
        display: none;
      }
      @media (max-width: 700px) {
        .lb {
          display: none;
        }
      }

      .ic {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 22px;
        height: 22px;
        color: var(--c);
        pointer-events: none;
      }
      .ic svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nm,
      .tp {
        padding-right: 26px;
      }
      .tg {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        display: flex;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
        pointer-events: none;
      }
      .tg i {
        flex: 1;
      }
      .tags span.tc {
        background: color-mix(in srgb, var(--c) 18%, var(--sf));
        box-shadow: inset 3px 0 0 var(--c);
        padding-left: 11px;
      }

      .n.dm {
        opacity: 0.28;
      }
      .n.hl {
        z-index: 3;
      }
      .n.hl .sp {
        stroke: var(--tc);
        stroke-width: 3;
      }
      .n.hl .sh {
        filter: drop-shadow(0 0 8px var(--tc));
      }
      .ep.dm,
      .ah.dm {
        opacity: 0.18;
      }
      .el.dm {
        opacity: 0.25;
      }
      #lgd {
        position: absolute;
        left: 50%;
        bottom: 66px;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
        max-width: min(760px, calc(100% - 24px));
        padding: 6px 8px;
        background: color-mix(in srgb, var(--sf) 90%, transparent);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ln);
        border-radius: 14px;
        box-shadow: var(--sh);
      }
      #lgd.off {
        display: none;
      }
      .lgt {
        font-size: 11px;
        color: var(--mu);
        padding: 0 4px;
      }
      .lt {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 99px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .lt i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--c);
      }
      .lt em {
        font-style: normal;
        font-size: 10px;
        color: var(--mu);
      }
      .lt:hover {
        background: var(--sf2);
      }
      .lt.on {
        border-color: var(--c);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent);
      }
      .md {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(10, 14, 24, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .md[hidden] {
        display: none;
      }
      .mb {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 16px;
        box-shadow: var(--sh);
        padding: 16px;
        width: min(880px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
      }
      .mb h3 {
        margin: 0;
        font-size: 15px;
        color: var(--tx);
      }
      #ct {
        height: 55vh;
        min-height: 260px;
        width: 100%;
        box-sizing: border-box;
        font:
          12px/1.5 "JetBrains Mono",
          monospace;
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 10px;
        resize: none;
        white-space: pre;
        tab-size: 4;
      }
      #cm {
        min-height: 18px;
        font-size: 12px;
      }
      .px {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 22px;
        height: 22px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--mu);
        cursor: pointer;
        font-size: 15px;
        line-height: 20px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .px:hover {
        background: var(--sf2);
        color: var(--tx);
        border-color: var(--ln);
      }
      #rp h3 {
        padding-right: 28px;
      }
      .bd{position:absolute;inset:0;background:rgba(8,12,26,.42);animation:bdi .2s ease-out}
      .dlg{position:absolute;left:28px;right:28px;top:0;bottom:28px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--ln);border-top:0;border-radius:0 0 16px 16px;box-shadow:0 18px 60px rgba(0,0,0,.35);animation:dli .26s cubic-bezier(.2,.8,.2,1)}
      @keyframes bdi{from{opacity:0}}
      @keyframes dli{from{opacity:0;transform:translateY(26px)}}
      .dh{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;flex:none;background:var(--sf);border-bottom:1px solid var(--ln)}
      .bc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
      .ll{font-size:11px;font-weight:600;color:var(--mu);white-space:nowrap}
      .bc a{cursor:pointer}.bc a:hover{color:var(--tx)}.bc i{margin:0 7px;opacity:.5;font-style:normal}.bc b{color:var(--tx)}
      .cx{border:0;background:transparent;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:var(--mu)}
      .cx:hover{background:var(--sf2);color:var(--tx)}
      .dh .lr{flex:none;padding:4px 8px}
      .lc{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px)}
      .lw{position:absolute;left:0;top:0;transform-origin:0 0}
      .lw.an{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
      .les,.lsg,.lts{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
      .lts{display:none}
      .lnd{position:absolute;left:0;top:0}
      .ltl{stroke:var(--ac);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
      .n.stub .tp,.n.stub .tech,.n.stub .desc,.n.stub .ic,.n.stub .h,.n.stub .code,.n.stub .zoom{display:none}
      .n.stub .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #st.lo #hud{display:none}
      .wh,.wh circle{pointer-events:all}
      .wh circle{fill:var(--sf);stroke:var(--ac);stroke-width:2;vector-effect:non-scaling-stroke}
      .wh:hover circle{fill:var(--ac)}
      .wh.h{cursor:ns-resize}.wh.v{cursor:ew-resize}.wh.d{cursor:move}
      .les,.lhs,#es,#hs{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
      /* Expanded parents are a backdrop; edges remain clickable above them. */
      .n.x{z-index:0}
      .les,#es{z-index:1}
      .n:not(.x){z-index:2}
      .n:not(.x).hl,.el{z-index:3}
      .lhs,#hs{z-index:4}
      .lsg,#sg{z-index:5}
      .lts,#ts{z-index:6}
      #reset-layer:disabled{opacity:.45;cursor:not-allowed}
      @media (max-width:700px){.dlg{left:14px;right:14px;bottom:14px}}
      @media (prefers-reduced-motion:reduce){.bd,.dlg{animation:none}.flow{display:none}}
      .mb .row { flex-wrap: wrap; }
      .mb .bt { flex: 1 1 auto; }
    </style>
  </head>
  <body>
    <header>
      <div class="lg">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="var(--ac)" />
          <rect
            x="7"
            y="7"
            width="10"
            height="10"
            rx="3"
            fill="none"
            stroke="#fff"
            stroke-width="2"
          />
          <rect
            x="10.5"
            y="10.5"
            width="3"
            height="3"
            rx="1"
            fill="#fff"
          /></svg
        >C4Model
      </div>
      <button class="ib" id="t1" title="Shared model">Model</button>
      <div id="tabs"></div>
      <button class="ib" id="zo">−</button><span id="zp">100%</span
      ><button class="ib" id="zi">+</button>
      <button class="ib" id="zf" title="Fit to view">Fit</button
      ><button class="ib" id="snap" type="button" aria-pressed="true" title="Snap elements while dragging; hold Alt to move freely">Snap</button
      ><button class="ib" id="reset-layer" title="Copy node positions and edge bends from the previous layer">Reset position of this layer</button
      ><button class="ib" id="tgb" title="Show or hide the tag legend">
        Tags</button
      ><button class="ib" id="cb" title="Export or import as code">Code</button
      ><button class="ib" id="share" title="Copy a link containing this workspace">Share</button
      ><button class="ib" id="th" title="Theme">◐</button
      ><button class="ib" id="nw" title="Start a new blank workspace">
        New</button
      ><button class="ib" id="t2" title="Show or hide inspector">Edit</button>
    </header>
    <div id="st">
      <div id="cv">
        <div id="w">
          <svg id="es"></svg>
          <div id="nd"></div>
          <svg id="hs"></svg>
          <svg id="sg" aria-hidden="true"></svg>
          <svg id="ts"><line id="tl" /></svg>
        </div>
      </div>
      <aside class="pn" id="lp">
        <h3>Drag onto the canvas</h3>
        <div id="pal"></div>
        <h3>Shared model (diagram count)</h3>
        <div id="ml"></div>
      </aside>
      <aside class="pn" id="rp"></aside>
      <div id="lgd"></div>
      <div id="hud">
        <button class="lv" data-l="1">
          L1<span class="lb"> Context</span></button
        ><button class="lv" data-l="2">
          L2<span class="lb"> Containers</span></button
        ><button class="lv" data-l="3">
          L3<span class="lb"> Components</span></button
        ><button class="lv" data-l="4">L4<span class="lb"> Code</span></button>
      </div>
    </div>
    <div id="cd" class="md" hidden>
      <div class="mb">
        <h3>Model as code</h3>
        <p class="mu">
          Structurizr-style text. Commit it to git, edit it, then apply it back
          here. <b>Apply</b> replaces the whole workspace; <b>Import</b> adds a
          file's diagrams as new tabs and merges elements that already exist.
        </p>
        <textarea
          id="ct"
          spellcheck="false"
          aria-label="Model as code"
        ></textarea>
        <div id="cm" class="mu"></div>
        <div class="row">
          <button class="bt" id="cim">Import file(s) as new tab(s)…</button>
          <button class="bt" id="cit">Import editor text as new tab(s)</button>
        </div>
        <div class="row">
          <button class="bt" id="cdl">Download .dsl</button
          ><button class="bt" id="cco">Copy</button
          ><button class="bt" id="cfb">Open file…</button
          ><button
            class="bt"
            id="cap"
            style="background: var(--ac); color: #fff; border-color: var(--ac)"
          >
            Apply to diagrams</button
          ><button class="bt" id="ccl">Close</button>
        </div>
        <input type="file" id="cf" accept=".dsl,.txt,text/plain" hidden />
        <input type="file" id="cif" accept=".dsl,.txt,text/plain" multiple hidden />
      </div>

            if (w === "workspace" && op) {
              st.push({ k: "ws" });
              return;
            }
            bad("expected workspace {");
          }
          if (c.k === "ws") {
            if ((w === "model" || w === "views") && op) {
              st.push({ k: w });
              return;
            }
            bad("expected model { or views {");
          }
          if (c.k === "views") {
            if (w === "custom" && op) {
              const v = ss(b),
                vw = {
                  id: v.length > 1 ? v[0] : "v" + (views.length + 1),
                  name: v.length > 1 ? v[1] : v[0] || "Diagram",
                  inc: [],
                  props: {},
                  groups: [],
                };
              views.push(vw);
              st.push({ k: "view", ref: vw });
              return;
            }
            bad('expected custom "id" "title" {');
          }
          if (c.k === "view") {
            if (w === "include") {
              b.slice(1).forEach((x) => {
                if (typeof x === "string" && x !== "*") c.ref.inc.push(x);
              });
              return;
            }
            if (w === "group" && op) {
              const v = ss(b),
                gp = {
                  id: v.length > 1 ? v[0] : "g" + uid(),
                  name: v.length > 1 ? v[1] : v[0] || "Group",
                  members: [],
                };
              c.ref.groups.push(gp);
              st.push({ k: "group", ref: gp });
              return;
            }
            if (w === "properties" && op) {
              st.push({ k: "props", ref: c.ref });
              return;
            }
            bad("unexpected " + w);
          }
          if (c.k === "group") {
            if (w === "include") {
              b.slice(1).forEach((x) => {
                if (typeof x === "string" && x !== "*") c.ref.members.push(x);
              });
              return;
            }
            bad("unexpected " + w);
          }
          if (b[1] === "=" && TY2[b[2]]) {
            const v = ss(b.slice(3)),
              ty = TY2[b[2]],
              cn = ty === "container" || ty === "component" || ty === "code",
              e = {
                id: b[0],
                type: ty,
                name: v[0] || b[0],
                desc: v[1] || "",
                tech: cn ? v[2] || "" : "",
                parent: c.k === "el" ? c.ref.id : null,
                tags: tg(cn ? v[3] : v[2]),
                props: {},
              };
            if (byId[e.id]) bad("duplicate id " + e.id);
            byId[e.id] = e;
            els.push(e);
            if (op) st.push({ k: "el", ref: e });
            return;
          }
          if (b[1] === "->") {
            const v = ss(b.slice(3));
            rels.push({
              f: b[0],
              t: b[2],
              l: v[0] || "",
              tech: v[1] || "",
              n: i + 1,
            });
            return;
          }
          if (c.k === "el" && w === "tags") {
            ss(b).forEach((x) =>
              tg(x).forEach((y) => {
                if (!c.ref.tags.includes(y)) c.ref.tags.push(y);
              }),
            );
            return;
          }
          if (c.k === "el" && w === "properties" && op) {
            st.push({ k: "props", ref: c.ref });
            return;
          }
          bad('unexpected "' + (typeof w === "object" ? w.s : w) + '"');
        });
        if (st.length > 1) throw new Error("Missing closing }");
        if (!els.length) throw new Error("No elements found");
        const E = els.map((e) => {
          const p = e.props;
          return {
            id: e.id,
            type:
              e.type === "system" && p.kind === "external"
                ? "external"
                : e.type,
            name: e.name,
            tech: e.tech || p.technology || "",
            desc: e.desc,
            parent: e.parent,
            code: p.code || "",
            tags: e.tags,
            icon: p.icon || "",
            shape: SHP[p.shape] ? p.shape : "",
          };
        });
        const RL = rels.map((r) => {
          if (!byId[r.f] || !byId[r.t])
            throw new Error(
              "Line " + r.n + ": unknown element in relationship",
            );
          return { id: uid(), from: r.f, to: r.t, label: r.l, tech: r.tech };
        });
        if (!views.length)
          views.push({
            id: "v1",
            name: "All elements",
            inc: els.filter((e) => !e.parent).map((e) => e.id),
            props: {},
          });
        const VS = views.map((v) => {
          const nodes = {},
            pos = {},
            tp = {},
            ew = {},
            labels = {},
            lay = {};
          v.inc.forEach((id, j) => {
            if (!byId[id])
              throw new Error('View "' + v.name + '": unknown element ' + id);
            const a = v.props["at." + id],
              xy = a ? a.split(",").map(Number) : null;
            nodes[id] =
              xy && xy.length === 2 && xy.every(isFinite)
                ? { x: xy[0], y: xy[1] }
                : { x: (j % 4) * 300, y: 80 + ((j / 4) | 0) * 200 };
          });
          Object.entries(v.props).forEach(([k, val]) => {
            const m = /^pos\.(\d)\.(.+)$/.exec(k),
              xy = val.split(",").map(Number);
            if (m && xy.length === 2 && xy.every(isFinite))
              (pos[m[1]] = pos[m[1]] || {})[m[2]] = { x: xy[0], y: xy[1] };
            const ex = /^(top|route|label|stub)\.([^.]+)\.(.+)$/.exec(k);
            if (!ex) return;
            const kind = ex[1],
              layer = decodeURIComponent(ex[2]),
              id = decodeURIComponent(ex[3]),
              point = xy.length === 2 && xy.every(isFinite) ? { x: xy[0], y: xy[1] } : null;
            if (kind === "route") {
              let route;
              try { route = JSON.parse(val); } catch (e) { throw new Error('View "' + v.name + '": invalid route ' + id); }
              const valid = (p) => p && Number.isFinite(p.x) && Number.isFinite(p.y);
              if (!(Array.isArray(route) && route.every(valid)) &&
                  !(route && Array.isArray(route.points) && route.points.every(valid) && valid(route.from) && valid(route.to)))
                throw new Error('View "' + v.name + '": invalid route ' + id);
              (ew[layer] = ew[layer] || {})[id] = route;
            } else if (!point) {
              throw new Error('View "' + v.name + '": invalid position ' + k);
            } else if (kind === "top") {
              (tp[layer] = tp[layer] || {})[id] = point;
            } else if (kind === "label") {
              (labels[layer] = labels[layer] || {})[id] = point;
            } else {
              (lay[layer] = lay[layer] || { c: {}, x: {} }).x[id] = point;
            }
          });
          return {
            id: v.id,
            name: v.name,
            nodes,
            pos,
            tp,
            ew,
            labels,
            lay,
            groups: (v.groups || [])
              .map((g) => ({
                id: g.id,
                name: g.name,
                members: g.members.filter((id) => byId[id]),
              }))
              .filter((g) => g.members.length),
          };
        });
        return { cur: VS[0].id, els: E, rels: RL, views: VS };
      }
      const msg = (t, bad) => {
        const m = $("#cm");
        m.textContent = t;
        m.style.color = bad ? "#e5484d" : "";
      };
      let shareResetTimer = null;
      $("#share").onclick = async () => {
        if (!validShareWorkspace(S)) {
          alert("This workspace cannot be shared because it contains invalid model data or unsupported IDs.");
          return;
        }
        const button = $("#share");
        clearTimeout(shareResetTimer);
        button.disabled = true;
        button.textContent = "Compressing…";
        try {
          const compressed = await new Promise((resolve, reject) =>
            LZMA.compress(new TextEncoder().encode(JSON.stringify(S)), 7,
              (result, error) => error ? reject(error) : resolve(result)),
          );
          const bytes = Uint8Array.from(compressed);
          // LZMA-JS writes an end marker; an unknown size keeps the stream compatible with xz.
          bytes.fill(0xff, 5, 13);
          const url = new URL(location.href);
          url.searchParams.set("share", toBase64Url(bytes));
          const note = url.href.length > 8000 ? " This link is long and may be rejected by some apps; download the DSL for larger workspaces." : "";
          try {
            await navigator.clipboard.writeText(url.href);
            button.textContent = "Copied!";
            shareResetTimer = setTimeout(() => { button.textContent = "Share"; }, 1800);
            if (note) alert("Share link copied." + note);
          } catch (e) {
            prompt("Copy this share link." + note, url.href);
          }
        } catch (e) {
          alert("Could not create share link: " + e.message);
        } finally {
          button.disabled = false;
          if (button.textContent === "Compressing…") button.textContent = "Share";
        }
      };
      $("#cb").onclick = () => {
        $("#ct").value = toDSL();
        msg("Workspace ready to edit or export.");
        $("#cd").hidden = false;
        $("#ct").focus();
      };
      $("#ccl").onclick = () => {
        $("#cd").hidden = true;
      };
      $("#cd").addEventListener("pointerdown", (e) => {
        if (e.target.id === "cd") $("#cd").hidden = true;
      });
      $("#cdl").onclick = () => {
        try {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([$("#ct").value], { type: "text/plain" }),
          );
          a.download = "workspace.dsl";
          a.click();
          msg("Download started. If nothing was saved, use Copy instead.");
        } catch (e) {
          msg("Download is blocked here. Use Copy instead.", 1);
        }
      };
      $("#cco").onclick = async () => {
        const t = $("#ct");
        try {
          await navigator.clipboard.writeText(t.value);
          msg("Copied.");
        } catch (e) {
          t.select();
          try {
            document.execCommand("copy");
            msg("Copied.");
          } catch (x) {
            msg("Select the text and copy it manually.", 1);
          }
        }
      };
      $("#cfb").onclick = () => $("#cf").click();
      $("#cf").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          $("#ct").value = r.result;
          msg("Loaded " + f.name + ". Review it, then press Apply.");
        };
        r.readAsText(f);
        e.target.value = "";
      };
      $("#cap").onclick = () => {
        try {
          const n = parseDSL($("#ct").value);
          S = n;
          sel = null;
          hl = null;
          boot();
          save();
          msg(
            "Applied: " +
              n.els.length +
              " elements, " +
              n.rels.length +
              " relationships, " +
              n.views.length +
              " diagrams.",
          );
        } catch (e) {
          msg(e.message, 1);
        }
      };
      /* ---------- import / merge another DSL without overwriting the workspace ---------- */
      const norm = (s) => String(s == null ? "" : s).trim().replace(/\s+/g, " ").toLowerCase(),
        tcls = (t) => (t === "external" ? "system" : t);

      /* Rewrite every id-bearing structure of an imported view (nodes, per-layer
         positions, edge routes, label offsets, stub positions, groups) through `map`. */
      function remapView(v, map) {
        const ids = (o) =>
            Object.fromEntries(
              Object.entries(o || {}).filter(([id]) => map[id]).map(([id, p]) => [map[id], p]),
            ),
          byLayer = (o) =>
            Object.fromEntries(Object.entries(o || {}).map(([L, m]) => [L, ids(m)])),
          edgeKey = (k) => {
            const [a, b] = k.split(">");
            return map[a] && map[b] ? map[a] + ">" + map[b] : null;
          },
          layerKey = (L) => (L[0] !== "f" ? L : map[L.slice(1)] ? "f" + map[L.slice(1)] : null),
          keyed = (o) => {
            const out = {};
            Object.entries(o || {}).forEach(([L, m]) => {
              const nl = layerKey(L);
              if (!nl) return;
              const r = (out[nl] = out[nl] || {});
              Object.entries(m).forEach(([k, val]) => {
                const nk = edgeKey(k);
                if (nk) r[nk] = val;
              });
            });
            return out;
          },
          stubs = {};
        Object.entries(v.lay || {}).forEach(([k, l]) => {
          const m = /^(.*?)(@l\d+)?$/.exec(k),
            id = map[m[1]];
          if (id) stubs[id + (m[2] || "")] = { c: l.c || {}, x: ids(l.x) };
        });
        let id = v.id,
          name = v.name,
          i = 2;
        if (!/^[\w-]+$/.test(id) || S.views.some((x) => x.id === id)) {
          do id = uid();
          while (S.views.some((x) => x.id === id));
        }
        while (S.views.some((x) => x.name === name)) name = v.name + " (" + i++ + ")";
        return {
          id,
          name,
          nodes: ids(v.nodes),
          pos: byLayer(v.pos),
          tp: byLayer(v.tp),
          ew: keyed(v.ew),
          labels: keyed(v.labels),
          lay: stubs,
          groups: (v.groups || [])
            .map((g) => ({
              id: g.id,
              name: g.name,
              members: [...new Set(g.members.map((m) => map[m]).filter(Boolean))],
            }))
            .filter((g) => g.members.length),
        };
      }

      /* Elements are "the same" when name + type + (remapped) parent match; ids are
         only a tie-breaker because auto-generated ids (container1...) collide across
         unrelated workspaces. Existing values always win; blanks are filled in. */
      function mergeWorkspace(n, st) {
        const before = S.els.slice(),
          used = new Set(),
          map = {},
          fresh = (base) => {
            let id = base,
              i = 2;
            while (El(id)) id = base + "_" + i++;
            return id;
          };
        n.els.forEach((e) => {
          const parent = (e.parent && map[e.parent]) || null,
            cands = before.filter(
              (x) =>
                !used.has(x.id) &&
                (x.parent || null) === parent &&
                norm(x.name) === norm(e.name) &&
                tcls(x.type) === tcls(e.type),
            ),
            hit = cands.find((x) => x.id === e.id) || cands[0];
          if (hit) {
            used.add(hit.id);
            map[e.id] = hit.id;
            ["tech", "desc", "code", "icon", "shape"].forEach((k) => {
              if (!hit[k] && e[k]) hit[k] = e[k];
              else if (k !== "icon" && k !== "shape" && hit[k] && e[k] && norm(hit[k]) !== norm(e[k])) st.kept++;
            });
            hit.tags = [...new Set([...(hit.tags || []), ...(e.tags || [])])];
            st.merged++;
          } else {
            const id = El(e.id) ? fresh(e.id) : e.id;
            if (id !== e.id) st.renamed++;
            map[e.id] = id;
            S.els.push({ ...e, id, parent, tags: [...(e.tags || [])] });
            st.added++;
          }
        });
        const rk = (f, t, l) => f + ">" + t + "|" + norm(l),
          seen = new Map(S.rels.map((r) => [rk(r.from, r.to, r.label), r]));
        n.rels.forEach((r) => {
          const f = map[r.from],
            t = map[r.to];
          if (!f || !t) return;
          const k = rk(f, t, r.label),
            ex = seen.get(k);
          if (ex) {
            if (!ex.tech && r.tech) ex.tech = r.tech;
            st.relDup++;
            return;
          }
          let id;
          do id = uid();
          while (S.rels.some((q) => q.id === id));
          const nr = { id, from: f, to: t, label: r.label, tech: r.tech };
          S.rels.push(nr);
          seen.set(k, nr);
          st.rels++;
        });
        n.views.forEach((v) => {
          const nv = remapView(v, map);
          S.views.push(nv);
          st.views.push(nv);
        });
      }

      function importDSL(items) {
        /* parse everything first so a syntax error in any file changes nothing */
        const parsed = items.map(({ name, text }) => {
          try {
            return parseDSL(text);
          } catch (e) {
            throw new Error(name + ": " + e.message);
          }
        });
        closeTo(0);
        const old = V();
        if (old) old.cam = { ...T };
        const backup = structuredClone(S),
          st = { added: 0, merged: 0, renamed: 0, rels: 0, relDup: 0, kept: 0, views: [] },
          blank = !S.els.length && S.views.every((v) => !Object.keys(v.nodes).length);
        try {
          if (blank) S.views = [];
          parsed.forEach((n) => mergeWorkspace(n, st));
          if (!st.views.length) throw new Error("Nothing to import");
        } catch (e) {
          S = backup;
          throw e;
        }
        S.cur = st.views[0].id;
        sel = null;
        boot();
        save();
        $("#ct").value = toDSL();
        const pl = (k, a, b) => k + " " + (k === 1 ? a : b || a + "s"),
          p = [
            "Imported " + pl(st.views.length, "tab"),
            pl(st.added, "new element"),
            st.merged + " merged with existing",
            pl(st.rels, "relationship") + " added",
          ];
        if (st.relDup) p.push(pl(st.relDup, "duplicate relationship") + " skipped");
        if (st.renamed) p.push(pl(st.renamed, "id") + " renamed to avoid clashes");
        if (st.kept) p.push(pl(st.kept, "differing text field") + " kept as in the current workspace");
        return p.join(" · ") + ".";
      }
      $("#cim").onclick = () => $("#cif").click();
      $("#cif").onchange = async (e) => {
        const files = [...e.target.files];
        e.target.value = "";
        if (!files.length) return;
        try {
          msg(importDSL(await Promise.all(files.map(async (f) => ({ name: f.name, text: await f.text() })))));
        } catch (err) {
          msg(err.message, 1);
        }
      };
      $("#cit").onclick = () => {
        try {
          msg(importDSL([{ name: "Editor text", text: $("#ct").value }]));
        } catch (err) {
          msg(err.message, 1);
        }
      };
      $("#tgb").onclick = () => $("#lgd").classList.toggle("off");
      $("#lgd").addEventListener("click", (e) => {
        const b = e.target.closest("[data-tag]");
        if (b) {
          hl = hl === b.dataset.tag ? null : b.dataset.tag;
          render();
        }
      });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!$("#cd").hidden) $("#cd").hidden = true;
          else if (hl) {
            hl = null;
            render();
          }
        }
      });
      function boot() {
        closeTo(0);
        tabs();
        model();
        inspector();
        fit();
        render();
      }
      if (innerWidth < 820) {
        $("#lp").classList.add("off");
        $("#rp").classList.add("off");
      }

      const DSL_FILES = [
        "default.dsl",
        "diagram.dsl",
        "model.dsl",
        "workspace.dsl",
      ];
      async function seedFromFile() {
        for (const f of DSL_FILES) {
          let txt;
          try {
            const r = await fetch(f, { cache: "no-store" });
            if (!r.ok) continue;
            txt = await r.text();
          } catch (e) {
            continue;
          }
          /* SPA servers answer a missing file with index.html and a 200 */
          if (/^\s*<(!doctype|html)/i.test(txt)) continue;
          try {
            S = parseDSL(txt);
            return null;
          } catch (e) {
            return { f, txt, err: e.message };
          }
        }
        return null;
      }
      (restored ? Promise.resolve(null) : seedFromFile()).then((bad) => {
        boot();
        if (shareError) alert(shareError);
        if (bad) {
          $("#ct").value = bad.txt;
          $("#cd").hidden = false;
          msg(bad.f + ": " + bad.err, 1);
        }
      });
    </script>
  </body>
</html>
